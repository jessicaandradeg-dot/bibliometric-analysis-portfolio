[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometric-analysis-portfolio-tools"
version = "0.1.0"
description = "Reproducible tools for exploratory bibliometric portfolio analyses"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
